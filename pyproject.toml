[project]
name = "zimparse"
version = "0.1.0"
description = "Structured data extraction from Zimbabwean identity documents using Claude."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
